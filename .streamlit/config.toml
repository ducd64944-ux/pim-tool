[server]
maxUploadSize = 500
maxMessageSize = 500

[theme]
base = "light"
# Màu thương hiệu dùng chung cho MỌI widget (checkbox, radio, toggle, focus, nút chính, link, tab đang chọn)
primaryColor = "#1e40af"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
borderColor = "#e2e8f0"
showWidgetBorder = true
linkColor = "#1e40af"
baseRadius = "8px"
buttonRadius = "8px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
baseFontSize = 15
dataframeHeaderBackgroundColor = "#f1f5f9"
dataframeBorderColor = "#e2e8f0"
greenColor = "#16a34a"
redColor = "#dc2626"
orangeColor = "#d97706"
blueColor = "#1e40af"
yellowColor = "#ca8a04"
# Ô thông báo (success/info/warning/error) + nhãn màu: chữ ĐẬM trên nền nhạt để đọc rõ
greenTextColor = "#14532d"
greenBackgroundColor = "#dcfce7"
blueTextColor = "#1e3a8a"
blueBackgroundColor = "#dbeafe"
orangeTextColor = "#7c2d12"
orangeBackgroundColor = "#ffedd5"
yellowTextColor = "#713f12"
yellowBackgroundColor = "#fef9c3"
redTextColor = "#7f1d1d"
redBackgroundColor = "#fee2e2"
grayTextColor = "#334155"
grayBackgroundColor = "#f1f5f9"

[client]
toolbarMode = "minimal"
